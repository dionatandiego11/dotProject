# ===========================================
# dotProject Nginx Configuration
# Segurança + Performance + API Routing
# ===========================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# HTTP Server - Redirect para HTTPS
server {
    listen 80;
    server_name localhost;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name localhost;
    
    root /var/www/html/frontend/dist;
    index index.html;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://localhost https://localhost:5173;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Request-Id $request_id always;
    
    # Logging
    log_subrequest on;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    
    # Static files caching
    location ~* \.(?:css|js|ico|woff|woff2|eot|svg|ttf|otf|png|gif|jpe?g|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    # Security: Block access to sensitive files
    location ~* ^/(debug2?|diagnose_login|reset_admin|fix_[^/]+\.php|php_errors\.log|\.env|composer\.|vendor/) {
        deny all;
        return 404;
    }
    
    # API Rate Limiting for login endpoint
    location /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_conn addr 10;
        
        # CORS headers for development
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        rewrite ^/api/(.*)$ /api.php/$1 last;
    }
    
    # General API rate limiting
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_conn addr 10;
        
        # CORS headers for development
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        rewrite ^/api/(.*)$ /api.php/$1 last;
    }
    
    # PHP API Handler
    location ~ ^/api\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass phpfpm:9000;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    # Legacy PHP handler (if needed)
    location ~ \.php$ {
        return 404; # Block direct PHP access
    }
    
    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers for frontend
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    
    # Block hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
    
    # Block .well-known if not needed
    location ~ /.well-known {
        allow all;
    }
}
