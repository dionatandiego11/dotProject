name: Quality Gate

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (PHPUnit + Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare CI environment file
        run: |
          cat <<'EOF' > .env
          DB_USER=dotproject
          DB_PASSWORD=dotproject123
          DB_NAME=dotproject
          JWT_SECRET=test-secret-key
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          EOF

      - name: Build and start backend stack
        run: docker compose up -d --build mariadb redis phpfpm

      - name: Wait for PHP-FPM container readiness
        run: |
          for i in $(seq 1 45); do
            if docker compose exec -T phpfpm php -v >/dev/null 2>&1; then
              echo "PHP-FPM is ready."
              exit 0
            fi
            sleep 2
          done
          echo "PHP-FPM did not become ready in time."
          docker compose ps
          docker compose logs --tail=200 phpfpm mariadb redis
          exit 1

      - name: Validate required PHP extension
        run: docker compose exec -T phpfpm php -m | grep -qi mysqli

      - name: Run PHP lint
        run: docker compose exec -T phpfpm sh -lc "cd /var/www/html && find src tests -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: Run backend test suite
        run: docker compose exec -T phpfpm vendor/bin/phpunit --colors=never

      - name: Shutdown backend stack
        if: always()
        run: docker compose down -v

  frontend-tests:
    name: Frontend (Vitest + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Gate passed
        run: echo "Backend and frontend quality gates passed."
