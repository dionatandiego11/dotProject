version: '3.7'
services:
  mariadb:
    image: mariadb:10.11
    restart: always
    volumes:
      - dpdb:/var/lib/mysql
      - ./db/dotproject.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/upgrade_google_integration.sql:/docker-entrypoint-initdb.d/02-google.sql
    environment:
      MYSQL_ROOT_PASSWORD: secretpw
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpfpm:
    build: ./.docker-compose
    image: dotproject-php82:local
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:alpine
    depends_on:
      - phpfpm
    volumes:
      - ./:/var/www/html
      - ./.docker-compose/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"

  # Frontend React (opcional - para desenvolvimento)
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - frontend

  # phpMyAdmin (opcional - para gerenciamento do banco)
  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mariadb
    profiles:
      - tools

volumes:
  dpdb:


