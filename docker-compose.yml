version: '3.7'
services:
  mariadb:
    image: mariadb:10.11
    restart: always
    volumes:
      - dpdb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secretpw
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpfpm:
    build: ./.docker-compose
    image: dotproject-php82:local
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:alpine
    depends_on:
      - phpfpm
    volumes:
      - ./:/var/www/html
      - ./.docker-compose/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"

volumes:
  dpdb:
